[project]
name = "package-a"
version = "0.1.0"
description = "Package A in the workspace"
requires-python = ">=3.9"

[project.optional-dependencies]
prod = ["psycopg2>=2.9.0"]
non-prod = ["psycopg2-binary>=2.9.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/package_a"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
