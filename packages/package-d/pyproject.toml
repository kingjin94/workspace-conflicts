[project]
name = "package-d"
version = "0.1.0"
description = "Package D in the workspace"
requires-python = ">=3.9"

[project.optional-dependencies]
prod = ["psycopg2>=2.9.0"]
non-prod = ["psycopg2-binary>=2.9.0"]

[tool.uv]
conflicts = [
    [
        { extra = "prod" },
        { extra = "non-prod" },
    ],
]

[tool.hatch.build.targets.wheel]
packages = ["src/package_d"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
